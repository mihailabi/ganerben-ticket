<!DOCTYPE html>
<html>
<head>
  <title>Ganerben Ticket Weiterleitung</title>
  <script>
    window.onload = function() {
      let timestamp = new Date().toISOString().replace(/[-:.TZ]/g, "");
      let randomNum = Math.floor(Math.random() * 10000);
      let uniqueId = "ganerben-" + timestamp + "-" + randomNum;
      console.log("Neuer Klick: " + uniqueId);
      window.location.href = "https://kinki.ditix.shop/event/5d6ki0047ki3czsx?ref=" + uniqueId;
    }
  </script>
</head>
<body>
  <p>Bitte warten... Du wirst weitergeleitet.</p>
</body>
</html>
